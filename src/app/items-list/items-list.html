<div class="container">
  
  <h2>Каталог товарів</h2>

  <div class="header-actions" style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px; justify-content: space-between;">
    
    <input 
      type="text" 
      placeholder="Пошук товарів..." 
      [(ngModel)]="searchText" 
      (ngModelChange)="onSearch()" 
      style="padding: 10px; width: 300px; border-radius: 20px; border: 1px solid #ccc;"
    >

    <div class="buttons" style="display: flex; gap: 10px;">
      
      <a *ngIf="isLoggedIn" routerLink="/add-item" style="background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-weight: bold; cursor: pointer;">
        + Додати
      </a>

      <button *ngIf="isLoggedIn" (click)="logout()" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer;">
        Вийти
      </button>

      <a *ngIf="!isLoggedIn" routerLink="/login" style="background: #3f51b5; color: white; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-weight: bold; cursor: pointer;">
        Увійти
      </a>

    </div>
    
  </div>

  <div class="list" style="display: flex; gap: 20px; flex-wrap: wrap;">
    <app-item-card 
      *ngFor="let product of products$ | async" 
      [product]="product"
      (cardClick)="handleCardClick($event)"
    ></app-item-card>
  </div>

</div>
