<div class="form-container">
  <h2>Додати новий товар</h2>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label>Назва товару</label>
      <input type="text" formControlName="title" placeholder="Наприклад: iPhone 16">
      
      <div class="error" *ngIf="productForm.get('title')?.invalid && productForm.get('title')?.touched">
        <small *ngIf="productForm.get('title')?.errors?.['required']">Назва обов'язкова</small>
        <small *ngIf="productForm.get('title')?.errors?.['minlength']">Мінімум 3 символи</small>
      </div>
    </div>

    <div class="form-group">
      <label>Ціна (грн)</label>
      <input type="number" formControlName="price">
      
      <div class="error" *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">
        <small *ngIf="productForm.get('price')?.errors?.['required']">Ціна обов'язкова</small>
        <small *ngIf="productForm.get('price')?.errors?.['min']">Ціна має бути більше 0</small>
      </div>
    </div>

    <div class="form-group">
      <label>Опис</label>
      <textarea formControlName="description" rows="4"></textarea>
      
      <div class="error" *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched">
        <small>Опис обов'язковий</small>
      </div>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="productForm.invalid">Зберегти</button>
      <a routerLink="/items" class="cancel">Скасувати</a>
    </div>

  </form>
</div>
