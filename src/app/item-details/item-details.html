<div class="details-container" style="padding: 20px; max-width: 600px; margin: 0 auto;">

  <div *ngIf="isLoading" style="text-align: center; font-size: 1.2rem; color: #666;">
    ⏳ Завантаження товару...
  </div>

  <div *ngIf="!isLoading && product" class="product-details">
    <a routerLink="/items" style="display: inline-block; margin-bottom: 20px; text-decoration: none; color: blue;">
      ← Назад до списку
    </a>

    <div *ngIf="product.image" style="margin-bottom: 20px;">
        <img [src]="product.image" [alt]="product.title" style="max-width: 100%; height: auto; border-radius: 8px;">
    </div>

    <h1>{{ product.title }}</h1>
    
    <p style="font-size: 1.1rem; color: #555;">
      {{ product.description }}
    </p>

    <h2 [style.color]="product.price > 200 ? 'red' : 'green'">
      Ціна: {{ product.price }} грн
    </h2>

    <button style="background: #3f51b5; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px;">
      Купити
    </button>
  </div>

  <div *ngIf="!isLoading && !product" style="text-align: center; color: red; margin-top: 50px;">
    <h2>Товар не знайдено 😢</h2>
    <p>Можливо, неправильний ID або сервер не відповідає.</p>
    <a routerLink="/items">Повернутися на головну</a>
  </div>

</div>
